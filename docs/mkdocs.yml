site_name: LibEDD Docs

site_url: ""
use_directory_urls: false
plugins: []

nav:
  - Inicio: 'index.md'
  - Sobre el Proyecto: 'about.md'
  - Módulos:
    - Index: 'modules/index.md'
    - err: 'modules/err/index.md'
    - sll: 'modules/sll/index.md'
    - dll: 'modules/dll/index.md'
    - sort: 'modules/sort/index.md'
    - heap: 'modules/heap/index.md'
    - bst: 'modules/bst/index.md'
    - cmd: 'modules/cmd/index.md'
  - Contribuidores: 'contributors.md'

theme:
  name: terminal
  palette: dark
  features:
    - navigation.side.indexes

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: true
      pygments_style: dracula
      noclasses: true
  - pymdownx.inlinehilite
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
